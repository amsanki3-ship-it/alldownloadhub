<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Downloader - Fast & Direct Storage Downloader</title>
    <meta name="theme-color" content="#070b14">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #070b14; color: #f1f5f9; font-family: system-ui, sans-serif; }
        .sleek-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.7) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
        }
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #f43f5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-purple-600 flex items-center justify-center text-white font-bold text-xl">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <span class="text-xl font-extrabold tracking-tight">All <span class="gradient-text">Downloader</span></span>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        
        <!-- 1. YOUTUBE IN-APP DIRECT DOWNLOADER -->
        <div class="sleek-card p-6">
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-11 h-11 rounded-2xl bg-red-600/20 text-red-500 border border-red-500/30 flex items-center justify-center text-xl">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <div>
                    <h3 class="font-extrabold text-base text-white">YouTube Direct Downloader</h3>
                    <p class="text-slate-400 text-xs">Direct In-App Download (480p, 720p, 1080p, MP3)</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="ytUrl" placeholder="Paste YouTube Link..." 
                       class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-red-500">
                <button onclick="loadYTFrame()" class="bg-gradient-to-r from-red-600 to-rose-600 text-white font-semibold text-xs px-6 py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    <span>Fetch Video Inside Page</span>
                </button>
            </div>

            <!-- IN-APP DOWNLOAD ENGINE CONTAINER -->
            <div id="ytEngine" class="hidden mt-4 rounded-xl overflow-hidden border border-slate-800 bg-slate-950 p-2">
                <iframe id="ytFrame" src="" class="w-full h-[400px] border-0 rounded-lg" allowtransparency="true" scrolling="yes"></iframe>
            </div>
        </div>

        <!-- 2. INSTAGRAM IN-APP DIRECT DOWNLOADER -->
        <div class="sleek-card p-6">
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-11 h-11 rounded-2xl bg-pink-600/20 text-pink-500 border border-pink-500/30 flex items-center justify-center text-xl">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div>
                    <h3 class="font-extrabold text-base text-white">Instagram Reel Direct Downloader</h3>
                    <p class="text-slate-400 text-xs">Download MP4 Reels Directly Inside This Page</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="instaUrl" placeholder="Paste Instagram Reel URL..." 
                       class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-pink-500">
                <button onclick="loadInstaFrame()" class="bg-gradient-to-r from-pink-600 to-purple-600 text-white font-semibold text-xs px-6 py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    <span>Fetch Reel Inside Page</span>
                </button>
            </div>

            <!-- IN-APP INSTA ENGINE CONTAINER -->
            <div id="instaEngine" class="hidden mt-4 rounded-xl overflow-hidden border border-slate-800 bg-slate-950 p-2">
                <iframe id="instaFrame" src="" class="w-full h-[420px] border-0 rounded-lg" allowtransparency="true" scrolling="yes"></iframe>
            </div>
        </div>

        <!-- 3. YOUTUBE THUMBNAIL DOWNLOADER -->
        <div class="sleek-card p-6">
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-amber-600 text-white flex items-center justify-center text-lg">
                    <i class="fa-solid fa-image"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm text-slate-100">YouTube Thumbnail Downloader</h3>
                    <p class="text-slate-400 text-[11px]">Save Ultra HD cover image directly</p>
                </div>
            </div>
            <div class="space-y-3">
                <input type="text" id="thumbUrl" placeholder="Paste YouTube Link..." 
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                <button onclick="getThumbnail()" class="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white font-semibold text-xs py-3 rounded-xl">
                    Fetch HD Thumbnail
                </button>
            </div>
            <div id="thumbResult" class="hidden mt-4 text-center space-y-3">
                <img id="thumbImg" src="" class="w-full h-44 object-cover rounded-xl border border-slate-800">
                <button onclick="downloadThumbnail()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> Save Image
                </button>
            </div>
        </div>

    </main>

    <!-- IN-APP JAVASCRIPT ENGINE -->
    <script>
        function loadYTFrame() {
            const url = document.getElementById('ytUrl').value.trim();
            if (!url) { alert('Kripya YouTube link paste karein!'); return; }

            const engine = document.getElementById('ytEngine');
            const frame = document.getElementById('ytFrame');
            
            // Clean YouTube video ID extraction
            let videoId = '';
            if (url.includes('v=')) {
                videoId = url.split('v=')[1].split('&')[0];
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else {
                videoId = url;
            }

            // In-app embedded downloader engine
            frame.src = `https://loader.to/api/card/?url=https://www.youtube.com/watch?v=${videoId}`;
            engine.classList.remove('hidden');
        }

        function loadInstaFrame() {
            const url = document.getElementById('instaUrl').value.trim();
            if (!url) { alert('Kripya Instagram Reel link paste karein!'); return; }

            const engine = document.getElementById('instaEngine');
            const frame = document.getElementById('instaFrame');

            // In-app embedded Instagram engine
            frame.src = `https://saveig.app/e?url=${encodeURIComponent(url)}`;
            engine.classList.remove('hidden');
        }

        function getThumbnail() {
            const url = document.getElementById('thumbUrl').value.trim();
            const resultBox = document.getElementById('thumbResult');
            const img = document.getElementById('thumbImg');

            let videoId = '';
            if (url.includes('v=')) {
                videoId = url.split('v=')[1].split('&')[0];
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            }

            if (videoId) {
                const thumbUri = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                img.src = thumbUri;
                resultBox.classList.remove('hidden');
            } else {
                alert('Valid YouTube URL dalein!');
            }
        }

        async function downloadThumbnail() {
            const imgUrl = document.getElementById('thumbImg').src;
            try {
                const response = await fetch(imgUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = 'YouTube_Thumbnail_HD.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (e) {
                window.open(imgUrl, '_blank');
            }
        }
    </script>
</body>
</html>
