<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Downloader - Fast & Direct Media Downloader</title>
    <meta name="theme-color" content="#070b14">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #070b14; color: #f1f5f9; font-family: system-ui, sans-serif; }
        .sleek-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.7) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
        }
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #f43f5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes customSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spin-loader { animation: customSpin 1s linear infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-purple-600 flex items-center justify-center text-white font-bold text-xl">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <span class="text-xl font-extrabold tracking-tight">All <span class="gradient-text">Downloader</span></span>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        
        <!-- 1. YOUTUBE VIDEO DOWNLOADER SECTION -->
        <div class="sleek-card p-6">
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-11 h-11 rounded-2xl bg-red-600/20 text-red-500 border border-red-500/30 flex items-center justify-center text-xl">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <div>
                    <h3 class="font-extrabold text-base text-white">YouTube Video Downloader</h3>
                    <p class="text-slate-400 text-xs">Get video resolutions and sizes instantly</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="ytUrl" placeholder="Paste YouTube Video URL here..." 
                       class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-red-500">
                <button onclick="fetchYouTube()" id="ytBtn" class="bg-gradient-to-r from-red-600 to-rose-600 text-white font-semibold text-xs px-6 py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>Fetch Video</span>
                </button>
            </div>

            <div id="ytResult" class="hidden mt-4 p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3"></div>
        </div>

        <!-- 2. INSTAGRAM REEL DOWNLOADER SECTION -->
        <div class="sleek-card p-6">
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-11 h-11 rounded-2xl bg-pink-600/20 text-pink-500 border border-pink-500/30 flex items-center justify-center text-xl">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div>
                    <h3 class="font-extrabold text-base text-white">Instagram Reel & Video Downloader</h3>
                    <p class="text-slate-400 text-xs">Direct high-speed MP4 reel downloader</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="instaUrl" placeholder="Paste Instagram Reel URL here..." 
                       class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-pink-500">
                <button onclick="fetchInstagram()" id="instaBtn" class="bg-gradient-to-r from-pink-600 to-purple-600 text-white font-semibold text-xs px-6 py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    <span>Download Reel</span>
                </button>
            </div>

            <div id="instaResult" class="hidden mt-4 p-4 rounded-xl bg-slate-950 border border-slate-800 text-center"></div>
        </div>

        <!-- 3. YOUTUBE THUMBNAIL DOWNLOADER SECTION -->
        <div class="sleek-card p-6">
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-amber-600 text-white flex items-center justify-center text-lg">
                    <i class="fa-solid fa-image"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm text-slate-100">YouTube Thumbnail Downloader</h3>
                    <p class="text-slate-400 text-[11px]">Extract and save Ultra HD cover photo</p>
                </div>
            </div>
            <div class="space-y-3">
                <input type="text" id="thumbUrl" placeholder="Paste YouTube video link..." 
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                <button onclick="getThumbnail()" class="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white font-semibold text-xs py-3 rounded-xl">
                    Fetch HD Thumbnail
                </button>
            </div>
            <div id="thumbResult" class="hidden mt-4 text-center space-y-3">
                <img id="thumbImg" src="" class="w-full h-44 object-cover rounded-xl border border-slate-800">
                <button onclick="downloadThumbnail()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> Save Thumbnail Image
                </button>
            </div>
        </div>

    </main>

    <!-- JAVASCRIPT SCRIPT -->
    <script>
        async function fetchYouTube() {
            const url = document.getElementById('ytUrl').value.trim();
            const resultBox = document.getElementById('ytResult');
            const btn = document.getElementById('ytBtn');

            if (!url) { alert('Kripya YouTube link dalein!'); return; }

            resultBox.classList.remove('hidden');
            resultBox.innerHTML = '<div class="text-center text-sky-400 text-xs"><i class="fa-solid fa-spinner spin-loader mr-2"></i>Fetching video details...</div>';
            btn.disabled = true;

            try {
                const res = await fetch(`https://api.cobalt.tools/api/json`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await res.json();

                if (data.url) {
                    resultBox.innerHTML = `
                        <div class="text-emerald-400 font-bold text-xs mb-2">✓ Video Ready:</div>
                        <div class="flex items-center justify-between bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <div>
                                <span class="text-white font-bold text-xs block">HD Video Stream</span>
                                <span class="text-slate-400 text-[10px]">High Speed Direct Download</span>
                            </div>
                            <a href="${data.url}" target="_blank" download class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-lg">
                                <i class="fa-solid fa-download mr-1"></i> Download MP4
                            </a>
                        </div>
                    `;
                } else if (data.status === 'picker' && data.picker.length > 0) {
                    let html = '<div class="text-emerald-400 font-bold text-xs mb-2">✓ Select Quality:</div><div class="space-y-2">';
                    data.picker.forEach(item => {
                        html += `
                            <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                                <span class="text-slate-200 text-xs font-semibold">${item.type || 'Video Quality'}</span>
                                <a href="${item.url}" target="_blank" download class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Download</a>
                            </div>
                        `;
                    });
                    html += '</div>';
                    resultBox.innerHTML = html;
                } else {
                    resultBox.innerHTML = '<span class="text-red-400 text-xs">Video fetch nahi ho paya. Doosra link try karein.</span>';
                }
            } catch (e) {
                resultBox.innerHTML = '<span class="text-red-400 text-xs">Network error! Dobara koshish karein.</span>';
            } finally {
                btn.disabled = false;
            }
        }

        async function fetchInstagram() {
            const url = document.getElementById('instaUrl').value.trim();
            const resultBox = document.getElementById('instaResult');
            const btn = document.getElementById('instaBtn');

            if (!url) { alert('Kripya Instagram link dalein!'); return; }

            resultBox.classList.remove('hidden');
            resultBox.innerHTML = '<span class="text-sky-400 text-xs"><i class="fa-solid fa-spinner spin-loader mr-2"></i>Processing Instagram Reel...</span>';
            btn.disabled = true;

            try {
                const res = await fetch(`https://api.cobalt.tools/api/json`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await res.json();

                if (data.url) {
                    resultBox.innerHTML = `
                        <div class="text-emerald-400 font-bold text-xs mb-2">✓ Instagram Reel Ready!</div>
                        <a href="${data.url}" target="_blank" download class="inline-block bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs px-6 py-2.5 rounded-xl">
                            <i class="fa-solid fa-download mr-1"></i> Save Reel to Device
                        </a>
                    `;
                } else {
                    resultBox.innerHTML = '<span class="text-red-400 text-xs">Reel fetch nahi ho payi. Link check karein.</span>';
                }
            } catch (e) {
                resultBox.innerHTML = '<span class="text-red-400 text-xs">Network error!</span>';
            } finally {
                btn.disabled = false;
            }
        }

        function getThumbnail() {
            const url = document.getElementById('thumbUrl').value.trim();
            const resultBox = document.getElementById('thumbResult');
            const img = document.getElementById('thumbImg');

            let videoId = '';
            if (url.includes('v=')) {
                videoId = url.split('v=')[1].split('&')[0];
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            }

            if (videoId) {
                const thumbUri = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                img.src = thumbUri;
                resultBox.classList.remove('hidden');
            } else {
                alert('Sahi YouTube URL dalein!');
            }
        }

        async function downloadThumbnail() {
            const imgUrl = document.getElementById('thumbImg').src;
            try {
                const response = await fetch(imgUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = 'YouTube_Thumbnail_HD.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (e) {
                window.open(imgUrl, '_blank');
            }
        }
    </script>
</body>
</html>
